<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>HMW Diverger</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      font-size: 14px;
      color: #333;
    }
    h2 {
      margin: 0 0 16px 0;
      font-size: 18px;
      font-weight: 600;
    }
    .input-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #666;
    }
    textarea {
      width: 100%;
      min-height: 80px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      transition: border-color 0.2s;
    }
    textarea:focus {
      outline: none;
      border-color: #0066FF;
    }
    textarea::placeholder {
      color: #999;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    #generate {
      background-color: #0066FF;
      color: white;
      margin-bottom: 16px;
    }
    #generate:hover:not(:disabled) {
      background-color: #0052CC;
    }
    #generate:disabled {
      background-color: #ccc;
      cursor: not-allowed;
      opacity: 0.6;
    }
    .loading-spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading .loading-spinner {
      display: inline-block;
    }
    .loading .button-text {
      display: none;
    }
    .results-container {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #e0e0e0;
    }
    .results-container.hidden {
      display: none;
    }
    .results-label {
      font-weight: 600;
      margin-bottom: 12px;
      color: #333;
    }
    .results-content {
      padding: 12px;
      background-color: #f8f8f8;
      border-radius: 6px;
      min-height: 100px;
      color: #555;
      font-size: 13px;
      line-height: 1.6;
    }
    .error {
      color: #d32f2f;
      background-color: #ffebee;
    }
    .success {
      color: #2e7d32;
    }
    .results-content.empty {
      color: #999;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h2>HMW Diverger</h2>
  
  <div class="input-group">
    <label for="hmw-input">How might we...</label>
    <textarea 
      id="hmw-input" 
      placeholder="Enter your HMW statement here"
      rows="3"
    ></textarea>
  </div>

  <button id="generate">
    <span class="loading-spinner"></span>
    <span class="button-text">Generate Ideas</span>
  </button>

  <div id="results" class="results-container hidden">
    <div class="results-label">Results:</div>
    <div id="results-content" class="results-content empty">
      Generated ideas will appear here
    </div>
  </div>

  <script>
    const input = document.getElementById('hmw-input');
    const generateBtn = document.getElementById('generate');
    const resultsContainer = document.getElementById('results');
    const resultsContent = document.getElementById('results-content');

    // State management
    let isLoading = false;

    function setLoading(loading) {
      isLoading = loading;
      if (loading) {
        generateBtn.classList.add('loading');
        generateBtn.disabled = true;
      } else {
        generateBtn.classList.remove('loading');
        generateBtn.disabled = false;
      }
    }

    function showResults(text, isError = false) {
      resultsContainer.classList.remove('hidden');
      resultsContent.classList.remove('empty', 'error', 'success');
      
      if (isError) {
        resultsContent.classList.add('error');
      } else {
        resultsContent.classList.add('success');
      }
      
      resultsContent.textContent = text;
    }

    function clearResults() {
      resultsContainer.classList.add('hidden');
      resultsContent.classList.add('empty');
      resultsContent.classList.remove('error', 'success');
      resultsContent.textContent = 'Generated ideas will appear here';
    }

    // Handle generate button click
    generateBtn.onclick = () => {
      const hmwText = input.value.trim();
      
      if (!hmwText) {
        showResults('Please enter a HMW statement', true);
        return;
      }

      // Show loading state
      setLoading(true);
      clearResults();
      
      // Send message to plugin code
      parent.postMessage({ 
        pluginMessage: { 
          type: 'generate-ideas', 
          hmwStatement: hmwText 
        } 
      }, '*');
    };

    // Listen for messages from plugin code
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      
      if (msg.type === 'generation-complete') {
        setLoading(false);
        showResults(msg.result);
      }
      
      if (msg.type === 'generation-error') {
        setLoading(false);
        showResults(msg.error || 'An error occurred', true);
      }
    };

    // Allow Enter key to submit (Shift+Enter for new line)
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !isLoading) {
        e.preventDefault();
        generateBtn.click();
      }
    });
  </script>
</body>
</html>
